server {
    listen 443 ssl;
    server_name realmed.qyvia.com.br;
    ssl_certificate /etc/letsencrypt/live/realmed.qyvia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realmed.qyvia.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/realmed-access.log;
    error_log /var/log/nginx/realmed-error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/realmed-acme;
    }
    location / {
        proxy_pass http://10.100.67.92:5185;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 443 ssl;
    server_name realmedapi.qyvia.com.br;
    ssl_certificate /etc/letsencrypt/live/realmed.qyvia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realmed.qyvia.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/realmedapi-access.log;
    error_log /var/log/nginx/realmedapi-error.log;
    client_max_body_size 10m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/realmed-acme;
    }
    location / {
        proxy_pass http://10.100.67.92:3013;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
server {
    listen 80;
    server_name realmed.qyvia.com.br realmedapi.qyvia.com.br;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/realmed-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

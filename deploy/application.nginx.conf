server {
    listen 10.100.67.92:5185;
    server_name realmed.qyvia.com.br;
    root /qyvia/realmed/current/frontend/dist;
    index index.html;
    access_log /qyvia/realmed/logs/frontend-access.log;
    error_log /qyvia/realmed/logs/frontend-error.log;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
